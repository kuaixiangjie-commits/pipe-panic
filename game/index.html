<title>Pipe Panic! — Copperton</title>

</style>

<canvas id="game" aria-label="Pipe Panic: move the plumber with WASD or arrow keys, hold E to repair burst pipes and mop water before the building floods"></canvas>
<p id="status" role="status" aria-live="polite"></p>
